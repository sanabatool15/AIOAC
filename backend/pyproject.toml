[project]
name = "aioac-backend"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy>=2.0", "pydantic>=2", "pydantic-settings", "httpx", "numpy", "pandas", "scikit-learn", "pyarrow", "boto3"]

[project.optional-dependencies]
dev = ["pytest", "inngest>=0.5"]
postgres = ["psycopg[binary]>=3.1"]
inngest = ["inngest>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["skills/*.md", "providers/training/sagemaker_script/*.py"]
