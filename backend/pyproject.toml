[project]
name = "aioac-backend"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy>=2.0", "pydantic>=2", "pydantic-settings", "httpx", "numpy", "pandas", "scikit-learn", "pyarrow", "boto3"]

[project.optional-dependencies]
dev = ["pytest", "inngest>=0.5"]
postgres = ["psycopg[binary]>=3.1"]
inngest = ["inngest>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: talks to real services (AWS, PayPal sandbox, LLM, database, live datasets); skipped unless RUN_REAL=1 pytest tests/real"]

[tool.setuptools.packages.find]
include = ["app*", "doubles*"]

[tool.setuptools.package-data]
app = ["skills/*.md", "integrations/aws/train_script/*.py", "integrations/datasets/curated.json"]
